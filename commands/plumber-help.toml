description = "Quick reference for plumber levels and commands"
prompt = "Show the plumber quick reference. One shot, change nothing: do not switch mode, write flag files, or persist anything. Levels: /plumber lite (writes the fix, flags the cleaner redesign in one line), /plumber (full, the default ladder: root cause then design check then remove then simplest), /plumber ultra (won't write a line until root cause is identified, challenges whether the problem should exist). Commands: /plumber-diagnose (explicit step-by-step diagnosis before acting), /plumber-review (patchwork review of current changes), /plumber-audit (whole-repo patchwork audit), /plumber-help (this card). Deactivate with 'stop plumber', 'normal mode', or /plumber off; resume anytime with /plumber. Default mode is full."
